<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Whitescent — Modular Cognitive Entity</title>
  <style>
    :root {
      --bg: #0f1115;
      --panel: #171a21;
      --panel-2: #1f242d;
      --border: #2a303c;
      --text: #e6e9ef;
      --muted: #9aa3b2;
      --accent: #7aa2f7;
      --active: #bb9af7;
      --ok: #73daca;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 12px 18px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.4px; }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--ok);
    }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    button, select, input {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-size: 0.82rem;
    }
    button { cursor: pointer; transition: 0.15s; }
    button:hover { border-color: var(--accent); }
    button.active {
      background: rgba(187, 154, 247, 0.18);
      border-color: var(--active);
      color: var(--active);
      font-weight: 600;
    }
    .main { flex: 1; display: flex; overflow: hidden; }
    .chat-area { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .msg {
      max-width: 840px;
      padding: 14px 16px;
      border-radius: 12px;
      line-height: 1.65;
      font-size: 0.92rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #232a3b;
      border: 1px solid #333e57;
    }
    .msg.ai {
      align-self: flex-start;
      background: var(--panel);
      border: 1px solid var(--border);
      width: 100%;
    }
    .msg-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.74rem;
      color: var(--muted);
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    .promote-btn {
      font-size: 0.72rem;
      padding: 2px 8px;
      color: var(--ok);
      border-color: rgba(115, 218, 202, 0.35);
    }
    .promote-btn.promoted {
      background: rgba(115, 218, 202, 0.15);
      cursor: default;
    }
    .input-bar {
      background: var(--panel);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      resize: none;
      height: 54px;
      font-family: inherit;
    }
    textarea:focus { outline: none; border-color: var(--accent); }
    .send-btn {
      background: var(--accent);
      color: #0b0d12;
      font-weight: 700;
      border: none;
      padding: 0 18px;
      border-radius: 10px;
    }
    .drawer {
      width: 325px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .drawer-section h2 { font-size: 0.88rem; color: var(--accent); margin-bottom: 6px; }
    .drawer-section p, .drawer-section label { font-size: 0.78rem; color: var(--muted); line-height: 1.45; }
    .soul-item {
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      font-size: 0.78rem;
      margin-top: 6px;
    }
    .soul-item button {
      margin-top: 5px;
      font-size: 0.7rem;
      padding: 2px 6px;
      color: #f7768e;
    }
    @media (max-width: 820px) {
      .drawer { display: none; }
      .drawer.open { display: flex; position: fixed; right: 0; top: 54px; bottom: 0; z-index: 20; width: 90%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>WHITESCENT</h1>
      <span class="badge" id="genBadge">Gen-1 · 대기</span>
    </div>
    <div class="controls" id="headerControls">
      <button id="clearChatBtn" type="button">대화 초기화</button>
      <button id="exportBtn" type="button">Soul 백업</button>
      <button id="importBtn" type="button">Soul 복원</button>
      <input type="file" id="importFile" accept=".json" style="display:none" />
      <button id="drawerToggle" type="button">설정·기억</button>
    </div>
  </header>

  <div class="main">
    <div class="chat-area">
      <div id="messages"></div>
      <div class="input-bar">
        <textarea id="userInput" placeholder="심리·연애 맥락이나 고민을 입력하세요... (Enter 전송, Shift+Enter 줄바꿈)"></textarea>
        <button class="send-btn" id="sendBtn" type="button">전송</button>
      </div>
    </div>
    <aside class="drawer" id="drawer"></aside>
  </div>

  <script>
    // === Whitescent 모듈 플러그인 버스 (앞으로 생길 1번, 2번, 3번... js 파일이 여기에 붙음) ===
    const STORAGE_KEY = "whitescent_soul_v3";
    const CONFIG_KEY = "whitescent_config_v3";

    let soul = {
      version: "3.0",
      generation: 1,
      promotedMemories: [],
      extraData: {} // 뒷번호 모듈(2번, 3번...)이 자기 전용 데이터를 여기에 저장
    };

    let config = {
      engineActive: false,
      geminiModel: "gemini-2.5-flash",
      apiKey: "",
      webSearch: true,
      extraConfig: {}
    };

    let conversationHistory = [];
    const promptHooks = [];
    const responseHooks = [];
    let sendHandler = null;

    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (s && typeof s === "object") soul = { ...soul, ...s, extraData: { ...(s.extraData || {}) } };
    } catch (_) {}

    try {
      const c = JSON.parse(localStorage.getItem(CONFIG_KEY));
      if (c && typeof c === "object") config = { ...config, ...c, extraConfig: { ...(c.extraConfig || {}) } };
    } catch (_) {}

    window.WhitescentBus = {
      getState: () => ({ soul, config, conversationHistory }),
      saveSoul: () => {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(soul)); } catch (_) {}
        window.dispatchEvent(new CustomEvent("whitescent:soulUpdated", { detail: soul }));
      },
      saveConfig: () => {
        try { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } catch (_) {}
        window.dispatchEvent(new CustomEvent("whitescent:configUpdated", { detail: config }));
      },
      registerPromptHook: (fn) => promptHooks.push(fn),
      buildSystemPrompt: (basePrompt, ctx) => {
        let p = basePrompt;
        for (const fn of promptHooks) p = fn(p, ctx);
        return p;
      },
      registerResponseHook: (fn) => responseHooks.push(fn),
      runResponseHooks: async (reply, ctx) => {
        let r = reply;
        for (const fn of responseHooks) r = await fn(r, ctx);
        return r;
      },
      setSendHandler: (fn) => { sendHandler = fn; },
      addDrawerSection: (id, titleHtml, renderFn) => {
        const drawer = document.getElementById("drawer");
        let sec = document.getElementById("sec_" + id);
        if (!sec) {
          sec = document.createElement("div");
          sec.className = "drawer-section";
          sec.id = "sec_" + id;
          drawer.appendChild(sec);
        }
        sec.innerHTML = `<h2>${titleHtml}</h2><div id="body_${id}"></div>`;
        renderFn(document.getElementById("body_" + id));
        return document.getElementById("body_" + id);
      },
      appendMessage: (role, text, metaLabel = "", allowPromote = false) => {
        const box = document.getElementById("messages");
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        if (role === "ai") {
          const meta = document.createElement("div");
          meta.className = "msg-meta";
          meta.innerHTML = `<span>Whitescent Gen-${soul.generation} · ${metaLabel}</span>`;
          if (allowPromote) {
            const btn = document.createElement("button");
            btn.className = "promote-btn";
            btn.type = "button";
            btn.textContent = "+ 기억 승격";
            btn.addEventListener("click", () => {
              const summary = prompt("장기 기억으로 각인할 핵심 규칙이나 사례를 입력해 주세요.", text.slice(0, 220));
              if (!summary || !summary.trim()) return;
              soul.promotedMemories.push({
                id: Date.now(),
                gen: soul.generation,
                date: new Date().toISOString().slice(0, 10),
                text: summary.trim()
              });
              soul.generation += 1;
              window.WhitescentBus.saveSoul();
              btn.textContent = "승격 완료 (Gen-" + soul.generation + ")";
              btn.classList.add("promoted");
              btn.disabled = true;
            });
            meta.appendChild(btn);
          }
          div.appendChild(meta);
        }
        const content = document.createElement("div");
        content.textContent = text;
        div.appendChild(content);
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
        return div;
      },
      toggleDrawer: (forceOpen) => {
        const d = document.getElementById("drawer");
        if (typeof forceOpen === "boolean") d.classList.toggle("open", forceOpen);
        else d.classList.toggle("open");
      }
    };

    function updateGenBadge() {
      const badge = document.getElementById("genBadge");
      const status = (config.engineActive && config.apiKey) ? config.geminiModel : "대기 중";
      badge.textContent = `Gen-${soul.generation} · ${status}`;
    }

    document.getElementById("clearChatBtn").addEventListener("click", () => {
      conversationHistory = [];
      document.getElementById("messages").innerHTML = "";
      window.WhitescentBus.appendMessage("ai", "대화 문맥을 초기화했습니다.", "문맥 초기화", false);
    });

    document.getElementById("exportBtn").addEventListener("click", () => {
      const blob = new Blob([JSON.stringify(soul, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `whitescent_soul_gen${soul.generation}.json`;
      a.click();
    });

    document.getElementById("importBtn").addEventListener("click", () => document.getElementById("importFile").click());
    document.getElementById("importFile").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported.promotedMemories)) throw new Error("유효하지 않은 Soul 파일");
          soul = { ...soul, ...imported, extraData: { ...(imported.extraData || {}) } };
          window.WhitescentBus.saveSoul();
          alert(`Soul 복원 완료! 현재 세대: Gen-${soul.generation}`);
        } catch (err) {
          alert("복원 실패: " + err.message);
        }
      };
      reader.readAsText(file);
    });

    document.getElementById("drawerToggle").addEventListener("click", () => window.WhitescentBus.toggleDrawer());

    async function triggerSend() {
      const inputEl = document.getElementById("userInput");
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = "";
      if (sendHandler) await sendHandler(text);
      else window.WhitescentBus.appendMessage("ai", "1번 코어(ws_01_gemini_core.js)가 아직 연결되지 않았습니다.", "알림", false);
    }

    document.getElementById("sendBtn").addEventListener("click", triggerSend);
    document.getElementById("userInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        triggerSend();
      }
    });

    window.addEventListener("whitescent:soulUpdated", updateGenBadge);
    window.addEventListener("whitescent:configUpdated", updateGenBadge);
    updateGenBadge();
  </script>

  <!-- 1번 모듈: Gemini API 코어 + 승격 기억 관리 -->
  <script type="module" src="./ws_01_gemini_core.js"></script>
</body>
</html>
  <!-- 1번 모듈: Hydrogen & Neon Gemini 코어 + 승격 기억 관리 -->
  <script type="module" src="./hn_01_hydrogen_neon_core.js"></script>
  <!-- 2번 모듈: 심리 미세 디테일 + 직접 조언 + 구시대 멘트 차단 -->
  <script type="module" src="./hn_02_psych_detail.js"></script>
  <!-- 3번 모듈: 금지 멘트 블랙리스트 + 사례 축적 + 자가 회고 진화 -->
  <script type="module" src="./hn_03_self_evolution.js"></script>
  <!-- 4번 모듈: 관계 국면 고정 + 대화 해부 + 집중 분석 축 -->
  <script type="module" src="./hn_04_dialogue_parser.js"></script>
</body>
</html>
